<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BI GCO — Fechamento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#1F3864; --blue:#2F5597; --light:#D9E1F2; --grey:#F2F2F2; --yel:#FFF2CC;
  --bg:#F5F7FB; --card:#FFFFFF; --text:#1F2933; --muted:#5F6B7A; --line:#DDE3EC;
  --red:#C0392B; --green:#1E8449;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{font-size:17px;margin:0 12px 0 0;white-space:nowrap}
header select,header button{font-size:13px;padding:6px 8px;border-radius:6px;border:1px solid #9fb0cf}
header .status{font-size:12px;opacity:.85;margin-left:auto}
header .hbtn{font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid #9fb0cf;background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap}
header .hbtn:hover{background:var(--light)}
nav{display:flex;gap:4px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:52px;z-index:9}
nav button{border:0;background:transparent;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--muted);white-space:nowrap}
nav button.on{background:var(--light);color:var(--navy);font-weight:bold}
main{padding:16px;max-width:1480px;margin:0 auto}
main:has(#t-dados.on),main:has(#t-pagos.on){max-width:1920px}
section{display:none} section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;color:var(--navy);margin:0 0 10px}
.card h3{font-size:13px;color:var(--navy);margin:14px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:20px;font-weight:bold;margin-top:4px;color:var(--navy)}
.kpi .v.neg{color:var(--red)}
.acms{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.acm .nm{font-weight:bold;color:var(--navy);font-size:13px;margin-bottom:8px;text-transform:uppercase}
.acm .lin{display:flex;justify-content:space-between;font-size:13px;margin:3px 0;color:var(--muted)} .acm .lin b{color:var(--navy)}
.acm .lin b.ok{color:#2e7d32} .acm .lin b.neg{color:var(--red)} .acm .falta{font-size:15px;margin-top:6px} .acm .falta span{color:var(--navy);font-weight:bold}
.acm .bar{height:8px;background:#e6ebf2;border-radius:4px;overflow:hidden;margin:8px 0 4px} .acm .bar i{display:block;height:100%;background:#2e7d32}
.acm .pc{font-size:11px;color:var(--muted);text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.tw{overflow-x:auto}
.tw.dados{max-height:72vh;overflow:auto;border:1px solid #dfe5ee;border-radius:8px}
.tw.dados table{font-size:12px}.tw.dados td,.tw.dados th{white-space:nowrap;padding:5px 8px}
.tw.dados td.item{white-space:normal;min-width:240px}
.tw.dados thead th{position:sticky;top:0;z-index:2}.tw.dados tfoot td{position:sticky;bottom:0;background:#eef2f8;z-index:2}
table{border-collapse:collapse;width:100%;font-size:13px}
/* relatórios: tabela do tamanho do conteúdo, centralizada no cartão */
table.rel{width:100%}
table.rel td:first-child{width:34%;min-width:300px;white-space:normal}
table.rel td.n{min-width:120px}
table.rel td.n.pct,table.rel td.pct{min-width:56px}
table.rel th{padding:7px 12px}
th{background:var(--navy);color:#fff;padding:6px 8px;text-align:center;white-space:nowrap;font-weight:bold}
th.sub{background:var(--blue)}
td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n{text-align:right;font-variant-numeric:tabular-nums}
td.lab{white-space:normal;min-width:260px}
tr.tot td{background:var(--light);font-weight:bold;border-top:2px solid var(--navy)}
tr.prod td{background:var(--grey);font-weight:bold}
tr.sec td{color:var(--navy);font-weight:bold;padding-top:12px;border-bottom:0}
tr.memo td{color:var(--muted);font-style:italic;font-size:12px}
.neg{color:var(--red)} .ok{color:var(--green)}
.pct{color:var(--muted);font-size:12px}
input.in{width:110px;text-align:right;background:var(--yel);border:1px solid #e3cf8a;border-radius:4px;padding:4px;color:#0000c8;font-size:13px}
input.txt,select.txt{border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-size:13px}
.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn.sm{padding:3px 8px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}
.muted{color:var(--muted);font-size:12px}
.prog{position:sticky;top:56px;z-index:9;background:#fff;border-bottom:1px solid #dde3ee;padding:8px 16px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--navy)}
.prog[hidden]{display:none}
.prog .pb{flex:0 0 320px;height:12px;background:#e6ebf3;border-radius:6px;overflow:hidden}
.prog .pf{height:100%;width:0;background:var(--navy);border-radius:6px;transition:width .6s}
.prog .pp{font-weight:700;min-width:44px;text-align:right}
.prog.erro .pf{background:var(--red)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--light);color:var(--navy)}
.tag.warn{background:#FDEBD0;color:#9A5B00}
.tag.bad{background:#FADBD8;color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 10px;cursor:pointer;font-size:12px}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
canvas{max-height:300px}
.drop{border:2px dashed #9fb0cf;border-radius:10px;padding:18px;text-align:center;color:var(--muted);background:#fff}

/* ===================== CELULAR ===================== */
@media (max-width:700px){
  body{font-size:13px}
  header{position:static;padding:8px 10px;gap:6px}
  header h1{font-size:15px;width:100%;margin:0}
  header .status{display:none}
  header select{font-size:13px;padding:5px 6px}
  header .hbtn{font-size:12px;padding:5px 8px}
  nav{top:0;padding:6px 8px;gap:2px}
  nav button{padding:7px 9px;font-size:13px}
  .prog{top:44px;padding:6px 10px;flex-wrap:wrap;gap:6px;font-size:12px}
  .prog .pb{flex:1 1 60%}
  main{padding:8px}
  .card{padding:10px;border-radius:8px;margin-bottom:10px}
  .card h2{font-size:14px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:9px}
  .kpi .v{font-size:16px}
  .acms{grid-template-columns:1fr 1fr;gap:8px}
  .acms>.acm:last-child:nth-child(odd){grid-column:1 / -1}
  .acm .nm{font-size:11px;margin-bottom:4px}
  .acm .lin{font-size:11px;margin:2px 0}
  .acm .falta{font-size:12px}
  .acm .bar{margin:5px 0 2px}
  /* tabelas largas: rolam para o lado com a coluna dos nomes fixa */
  .tw{-webkit-overflow-scrolling:touch}
  table{font-size:12px}
  th{padding:6px 6px}
  td{padding:5px 6px}
  table.rel td:first-child,table.rel th:first-child{position:sticky;left:0;z-index:1;background:#fff;width:auto;min-width:150px;max-width:170px;white-space:normal;box-shadow:2px 0 0 var(--line)}
  table.rel th:first-child{background:var(--navy);z-index:2}
  table.rel tr.tot td:first-child{background:var(--light)}
  table.rel tr.prod td:first-child{background:var(--grey)}
  table.rel tr.sec td:first-child{min-width:150px}
  table.rel td.n{min-width:88px}
  table.rel td.n.pct{min-width:46px}
  .card:has(table.rel)>h2::after{content:"  ·  arraste a tabela para o lado →";font-weight:normal;font-size:11px;color:var(--muted)}
  input.in{width:84px;font-size:12px}
  .row{gap:6px}
  .row label{width:100%}
  .row label input,.row label select{width:100% !important;margin-top:3px}
  .row .btn{flex:1 1 auto}
  canvas{max-height:260px}
}
</style>
</head>
<body>
<header>
  <h1>BI GCO · Fechamento</h1>
  <select id="selAno"></select>
  <select id="selMes"></select>
  <span class="status" id="status">—</span>
  <button class="hbtn" id="hBackup" title="Baixa um arquivo .json com todos os meses, lançamentos e premissas deste navegador">⤓ Backup</button>
  <label class="hbtn" title="Carrega um arquivo de backup .json">⤒ Restaurar backup<input type="file" id="hRestore" accept=".json" hidden></label>
</header>
<nav id="nav">
  <button data-t="painel" class="on">Painel</button>
  <button data-t="medicos">Resumo médicos</button>
  <button data-t="acerto">Acerto médicos</button>
  <button data-t="clinica">Resultado clínica</button>
  <button data-t="pagos">Pagos</button>
  <button data-t="premissas">Premissas</button>
  <button data-t="dados">Dados e integração</button>
</nav>
<div class="prog" id="prog" hidden><span class="pp" id="progPct">0%</span><div class="pb"><div class="pf" id="progBar"></div></div><span id="progTxt"></span></div>
<main>
  <section id="t-painel" class="on"></section>
  <section id="t-medicos"></section>
  <section id="t-acerto"></section>
  <section id="t-clinica"></section>
  <section id="t-pagos"></section>
  <section id="t-premissas"></section>
  <section id="t-dados"></section>
</main>

<script>
/*ENGINE-START*/
/* =====================================================================
   MOTOR DE REGRAS — espelho da planilha de fechamento (Premissas, Resumo
   Médicos, Resultado Clínica e Acerto Médicos). Sem DOM: dá para testar
   e reaproveitar no robô do Railway.
   ===================================================================== */
const DEFAULT_PREMISSAS = {
  versao: 1,
  medicos: {
    'RODRIGO DE OLIVEIRA PAZETTO': { consultas: 0.60, exames: 0.30, cirurgias: 0.70, procedimentos: 0.70, lentes: 0.30 },
    'NILTON PAZETTO':              { consultas: 0.70, exames: 0.30, cirurgias: 0.70, procedimentos: 0.70, lentes: 0.20 },
    'LUIZA BIRCK KLEIN':           { consultas: 0.60, exames: 0.30, cirurgias: 0.70, procedimentos: 0.70, lentes: 0.30 },
    'TACYANA PICININ':             { consultas: 0.60, exames: 0.30, cirurgias: 0.70, procedimentos: 0.70, lentes: 0.30 }
  },
  excecoesLentes: [
    { nomeCurto: 'TACYANA', tipo: 'Escleral', pct: 0.50 },
    { nomeCurto: 'TACYANA', tipo: 'Teste de Lente', pct: 0.60 },
    { nomeCurto: 'TACYANA', tipo: 'Lente', pct: 0.70 }
  ],
  palavrasProcedimento: ['YAG', 'EYLIA', 'ANTIANGIOGENICO', 'TOXINA', ' IPL', 'CO2', 'FOTOCOAGULA'],
  tiposLente: [ { palavra: 'ESCLERAL', tipo: 'Escleral' }, { palavra: 'TESTE DE LENTE', tipo: 'Teste de Lente' } ],
  maquina: { dono: 'NILTON PAZETTO', pct: 0.20, palavras: ['CAMPIMETRIA', 'RETINOGRAFIA', 'PAPILOGRAFIA'] },
  comissaoPct: 0.013,
  convenios: { 'PARTICULAR': 'Particular', 'PARTICULAR FAMILIAR': 'Particular', 'UNIMED': 'Unimed', 'IPERGS': 'IPE', 'SAUDE CAIXA': 'Saúde Caixa', 'SAÚDE CAIXA': 'Saúde Caixa' },
  grupoPadrao: 'Outros convênios',
  gruposOrdem: ['Particular', 'Unimed', 'IPE', 'Saúde Caixa', 'Outros convênios'],
  pagosRegras: [
    ['DARF','Outros impostos e taxas'],['ISSQN','Outros impostos e taxas'],['NFS-E','Serviços de terceiros'],
    ['NOTA FISCAL DE COMPRAS','Materiais e fornecedores'],['RECIBO','Outras despesas'],['BOLETO','Outras despesas'],['FATURA','Outras despesas'],
    ['FOLHA','Folha, encargos e benefícios'],['FP - ','Folha, encargos e benefícios'],['Recisão','Folha, encargos e benefícios'],
    ['Recursos Humanos','Folha, encargos e benefícios'],['UNIMED','Folha, encargos e benefícios'],['VR BENEFICIOS','Folha, encargos e benefícios'],
    ['INSS','Folha, encargos e benefícios'],['REPASSE MENSAL SÓCIO','Retirada das sócias administrativas'],['Aluguel','Aluguel e condomínio'],
    ['ENERGIA','Energia, água, telefone e internet'],['Água','Energia, água, telefone e internet'],['CLARO','Energia, água, telefone e internet'],
    ['Embratel','Energia, água, telefone e internet'],['TELECOM','Energia, água, telefone e internet'],['STARLINK','Energia, água, telefone e internet'],
    ['Manutenção','Manutenção e equipamentos'],['Mensal Alcon','Manutenção e equipamentos'],['MKT','Marketing'],['Marketing','Marketing'],
    ['Lentes Cirurgicas','FORA: insumo de lente (já descontado no líquido)'],['Lentes de Contato','FORA: insumo de lente (já descontado no líquido)'],
    ['PIS','FORA: imposto da nota (já descontado no líquido)'],['COFINS','FORA: imposto da nota (já descontado no líquido)'],
    ['IRPJ','FORA: imposto da nota (já descontado no líquido)'],['CSLL','FORA: imposto da nota (já descontado no líquido)'],
    ['Difernça de Valor Impostos','FORA: imposto da nota (já descontado no líquido)'],['Serviços Prestados - Compet','FORA: imposto da nota (já descontado no líquido)'],
    ['MDR CONTABILIDADE','Serviços de terceiros'],['esterilizacao','Serviços de terceiros'],['PARCELAMENTO','Parcelamentos de impostos'],
    ['PARCELA DE FINANCIAMENTO','Financiamentos bancários'],['ISSQN FIXO','Outros impostos e taxas'],['Capitalização','Título de capitalização'],
    ['CREDITO DE ADIANTAMENTO','FORA: adiantamento de paciente'],['Não Debitadas','Parcelamentos de impostos'],['TOTVS','Serviços de terceiros'],
    ['SUELEN DE ALMEIDA','Serviços de terceiros']
  ],
  gruposDespesa: ['Folha, encargos e benefícios','Retirada das sócias administrativas','Aluguel e condomínio','Outros impostos e taxas',
    'Materiais e fornecedores','Serviços de terceiros','Energia, água, telefone e internet','Manutenção e equipamentos','Marketing','Outras despesas'],
  gruposDivida: ['Financiamentos bancários','Parcelamentos de impostos','Título de capitalização']
};

const RELATORIOS = {
  consultas: { nome: 'Consultas', aba: 'Consultas', chaves: ['CONSULT'] },
  exames: { nome: 'Exames', aba: 'Exames', chaves: ['EXAME'] },
  cirurgias_procedimentos: { nome: 'Cirurgias e Procedimentos', aba: 'Cirurgia e Procedimentos', chaves: ['CIRURG', 'PROCED'] },
  lentes: { nome: 'Lentes', aba: 'Lentes', abas: ['Lentes', 'Lente'], chaves: ['LENTE'] },
  bloco: { nome: 'Bloco', aba: 'Bloco', chaves: ['BLOCO'] },
  pagos: { nome: 'Pagos', aba: 'Pagos', chaves: ['PAGO'] }
};
const RELS_PRODUCAO = ['consultas', 'exames', 'cirurgias_procedimentos', 'lentes', 'bloco'];
const AREAS = [
  ['consultas', 'Consultas'], ['exames', 'Exames'], ['cirurgias', 'Cirurgias'], ['procedimentos', 'Procedimentos'], ['lentes', 'Lentes']
];

const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; if (v == null || v === '') return 0;
  const s = String(v).trim(); const x = s.includes(',') ? parseFloat(s.replace(/\./g, '').replace(',', '.')) : parseFloat(s); return isFinite(x) ? x : 0; };
const UP = s => (s == null ? '' : String(s)).toUpperCase();
const has = (t, p) => UP(t).includes(UP(p));
const r2 = x => Math.round(x * 100) / 100;

/* ---------- datas ---------- */
function toDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return isNaN(v) ? null : new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 86400000)); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return new Date(+m[3], +m[2] - 1, +m[1]);
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}
function intervalo(per) {   // per = {ano, mes (1-12), parte: Q1|Q2|M}
  const fimMes = new Date(per.ano, per.mes, 0).getDate();
  const ini = per.parte === 'Q2' ? 16 : 1, fim = per.parte === 'Q1' ? 15 : fimMes;
  return { ini: new Date(per.ano, per.mes - 1, ini), fim: new Date(per.ano, per.mes - 1, fim) };
}
const dentro = (d, iv) => d && d >= iv.ini && d <= iv.fim;
const iso = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : '';

/* ---------- leitura dos relatórios do Totvs (array de linhas) ----------
   Aceita: (a) .xls exportado do Totvs (cabeçalho em qualquer linha, linhas
   de total, data/paciente só na 1ª linha) e (b) aba da planilha de
   fechamento (cabeçalho na linha 1). Devolve {linhas, totalGeral}. */
function lerRelatorio(aoa, tipo) {
  const alvo = tipo === 'pagos' ? 'BAIXADO TOTAL' : 'DATA_ATENDIMENTO';
  let hr = aoa.findIndex(r => (r || []).some(c => UP(c).trim() === alvo));
  if (hr < 0) throw new Error(`Cabeçalho não encontrado (procurei "${alvo}")`);
  const head = aoa[hr].map(c => (c == null ? '' : String(c).trim()));
  const linhas = []; let totalGeral = null, ult = null;
  for (let i = hr + 1; i < aoa.length; i++) {
    const r = aoa[i] || [];
    const o = {}; let vazio = true;
    head.forEach((h, j) => { if (!h) return; const v = r[j]; o[h] = (v === undefined ? '' : v); if (v !== '' && v != null) vazio = false; });
    if (vazio) continue;
    const primeiras = r.slice(0, 4).map(x => UP(x)).join(' ');
    if (primeiras.includes('TOTAL')) { if (primeiras.includes('GERAL')) totalGeral = o; continue; }
    if (tipo === 'pagos') {
      if (o['CENTRO DE CUSTOS'] === undefined && o['Centro de custos'] !== undefined) o['CENTRO DE CUSTOS'] = o['Centro de custos'];
      if (!num(o['Baixado Total']) && !o['Baixa']) continue;
      if ((o['Nome'] === '' || o['Nome'] == null) && ult) {
        for (const k of ['Filial', 'Venc.', 'Nº Doc.', 'Nome', 'Histórico', 'Tipo do Documento', 'CENTRO DE CUSTOS', 'Valor', 'Desconto'])
          if (o[k] === '' || o[k] == null) o[k] = ult[k];
      }
    } else {
      if (tipo === 'bloco' && o['PACIENTE'] === undefined) o['PACIENTE'] = o['NOMEPACIENTE'];
      if ((o['DATA_ATENDIMENTO'] === '' || o['DATA_ATENDIMENTO'] == null) && ult) o['DATA_ATENDIMENTO'] = ult['DATA_ATENDIMENTO'];
      if ((o['PACIENTE'] === '' || o['PACIENTE'] == null) && ult) {
        for (const k of (tipo === 'bloco' ? ['PACIENTE'] : ['PACIENTE', 'CONVÊNIO', 'PLANO'])) if (o[k] === '' || o[k] == null) o[k] = ult[k];
      }
      const resp = tipo === 'bloco' ? o['MEDICO_RESPONSAVEL'] : o['MÉDICO_RESPONSÁVEL'];
      if (!resp && !num(o['CAIXA']) && !num(o['VALOR_A_RECEBER_CONVÊNIO']) && !num(o['VALOR_CONVENIO'])) continue;
    }
    ult = o; linhas.push(o);
  }
  // normaliza datas para ISO (para guardar em JSON)
  for (const o of linhas) {
    if (tipo === 'pagos') { o['Baixa'] = iso(toDate(o['Baixa'])); o['Venc.'] = iso(toDate(o['Venc.'])); }
    else o['DATA_ATENDIMENTO'] = iso(toDate(o['DATA_ATENDIMENTO']));
  }
  return { linhas, totalGeral };
}

/* ---------- regras ---------- */
function criarMotor(P) {
  const ehDaCasa = m => Object.prototype.hasOwnProperty.call(P.medicos, m);
  const nomeCurto = m => UP(m).trim().split(' ')[0];
  const grupoConvenio = c => P.convenios[UP(c).trim()] || P.grupoPadrao;
  const areaCir = item => P.palavrasProcedimento.some(p => has(item, p)) ? 'procedimentos' : 'cirurgias';
  const tipoLente = item => { for (const t of P.tiposLente) if (has(item, t.palavra)) return t.tipo; return 'Lente'; };
  const ehMaquina = item => P.maquina.palavras.some(p => has(item, p));
  function pctExecutor(med, area, tipo) {
    const t = P.medicos[med]; if (!t) return 0;
    if (area === 'lentes') { const e = P.excecoesLentes.find(x => UP(x.nomeCurto) === nomeCurto(med) && x.tipo === tipo); if (e) return num(e.pct); }
    return num(t[area]);
  }

  function linha(rel, l) {
    const resp = UP(l['MÉDICO_RESPONSÁVEL']).trim(), sol = UP(l['MÉDICO_SOLICITANTE']).trim(), item = l['ITEM'];
    const area = rel === 'cirurgias_procedimentos' ? areaCir(item) : rel;
    const tipo = area === 'lentes' ? tipoLente(item) : null;
    const caixa = num(l['CAIXA']), conv = num(l['VALOR_A_RECEBER_CONVÊNIO']);
    const imposto = num(l['IMPOSTO_SOBRE_CAIXA']) + num(l['IMPOSTO_SOBRE_CONVÊNIO']);
    const cartao = num(l['DESCONTO_TAXA_CARTÃO']), insumo = num(l['CUSTO_INSUMO']), liquido = num(l['LÍQUIDO']);
    let repSol = num(l['REPASSE_INDICAÇÃO_MÉDICO_SOLICITANTE']);
    if (area === 'exames' && !ehDaCasa(sol)) repSol = 0;          // exame de médico de fora: sem repasse
    const base = liquido - repSol, pct = pctExecutor(resp, area, tipo), executor = base * pct;
    const comissao = (l['COMERCIAL'] != null && String(l['COMERCIAL']).trim() !== '') ? P.comissaoPct * (caixa + conv) : 0;
    const maquina = (area === 'exames' && ehMaquina(item)) ? P.maquina.pct * liquido : 0;
    const clinica = base - executor - comissao - maquina;
    return { rel, area, tipo, grupo: grupoConvenio(l['CONVÊNIO']), data: l['DATA_ATENDIMENTO'], item, convenio: l['CONVÊNIO'], paciente: l['PACIENTE'] || '',
      resp, sol, solDaCasa: ehDaCasa(sol), caixa, conv, bruto: caixa + conv, imposto, cartao, insumo, liquido,
      repSol, base, pct, executor, comissao, maquina, clinica, executorTotvs: num(l['REPASSE_MÉDICO_EXECUTOR']) };
  }
  function bloco(l) {
    const caixa = num(l['CAIXA']), conv = num(l['VALOR_CONVENIO']);
    return { rel: 'bloco', area: 'bloco', resp: UP(l['MEDICO_RESPONSAVEL']).trim(), sol: UP(l['MEDICO_SOLICITANTE']).trim(), data: l['DATA_ATENDIMENTO'], item: l['ITEM'],
      paciente: l['PACIENTE'] || l['NOMEPACIENTE'] || '', convenio: l['CONVENIO'], caixa, conv, bruto: caixa + conv, grupo: grupoConvenio(l['CONVENIO']),
      imposto: 0, cartao: 0, insumo: 0, liquido: caixa + conv, repSol: 0, base: 0, pct: 0, executor: 0, comissao: 0, maquina: 0, clinica: caixa + conv };
  }
  function grupoPago(p) {
    const texto = [p['Tipo do Documento'], p['Nome'], p['Histórico'], p['CENTRO DE CUSTOS'] ?? p['Centro de custos'] ?? ''].join(' | ');
    let g = 'VERIFICAR'; for (const [w, gr] of P.pagosRegras) if (w && has(texto, w)) g = gr; return g;
  }
  const secaoPago = g => g.startsWith('FORA:') ? 'Fora' : P.gruposDivida.includes(g) ? 'Dívida' : g === 'VERIFICAR' ? 'Verificar' : 'Despesa';

  /* ---------- cálculo completo de um período ---------- */
  function calcular(dados, per, lanc = {}, retencao = 0) {
    const iv = intervalo(per);
    const L = [];
    for (const rel of ['consultas', 'exames', 'cirurgias_procedimentos', 'lentes'])
      for (const l of (dados[rel] || [])) { const d = toDate(l['DATA_ATENDIMENTO']); if (dentro(d, iv)) L.push(linha(rel, l)); }
    const B = (dados.bloco || []).filter(l => dentro(toDate(l['DATA_ATENDIMENTO']), iv)).map(bloco);
    const PG = (dados.pagos || []).map(p => { const g = grupoPago(p); const d = toDate(p['Baixa']);
      return { ...p, grupo: g, secao: secaoPago(g), noPeriodo: dentro(d, iv), valor: dentro(d, iv) ? num(p['Baixado Total']) : 0 }; });

    const medicos = Object.keys(P.medicos);
    const soma = (arr, k) => arr.reduce((a, r) => a + r[k], 0);
    const zeroG = () => Object.fromEntries(P.gruposOrdem.map(g => [g, 0]));

    // Resumo por médico × área (executor = MÉDICO_RESPONSÁVEL)
    const porArea = {};
    for (const [a] of AREAS) {
      porArea[a] = {};
      for (const m of [...medicos, '__TOTAL__']) {
        const rs = L.filter(r => r.area === a && (m === '__TOTAL__' ? ehDaCasa(r.resp) : r.resp === m));
        const recebeu = L.filter(r => r.area === a && r.repSol && (m === '__TOTAL__' ? ehDaCasa(r.sol) : r.sol === m));
        porArea[a][m] = {
          caixa: soma(rs, 'caixa'), conv: soma(rs, 'conv'), bruto: soma(rs, 'bruto'), imposto: soma(rs, 'imposto'), cartao: soma(rs, 'cartao'),
          insumo: soma(rs, 'insumo'), liquido: soma(rs, 'liquido'), repSol: soma(rs, 'repSol'), base: soma(rs, 'base'),
          executor: soma(rs, 'executor'), comissao: soma(rs, 'comissao'), maquinaSai: soma(rs, 'maquina'), clinica: soma(rs, 'clinica'),
          executorTotvs: soma(rs, 'executorTotvs'), recebidoSol: soma(recebeu, 'repSol'),
          maquinaRecebe: (m === P.maquina.dono || m === '__TOTAL__') ? soma(L.filter(r => r.area === a), 'maquina') : 0
        };
      }
    }
    // Totais e acerto por médico
    const acerto = {};
    for (const m of medicos) {
      const porGrupo = zeroG(); let exe = 0, rec = 0, maq = 0;
      for (const r of L) {
        if (r.resp === m) { exe += r.executor; porGrupo[r.grupo] += r.executor; }
        if (r.sol === m && r.repSol) { rec += r.repSol; porGrupo[r.grupo] += r.repSol; }
        if (m === P.maquina.dono && r.maquina) { maq += r.maquina; porGrupo[r.grupo] += r.maquina; }
      }
      const lm = lanc[m] || {}; const pf = lm.pf || {};
      const recebidoPF = P.gruposOrdem.reduce((a, g) => a + num(pf[g]), 0);
      const jaPago = num(lm.adiantamentos) + num(lm.outros);
      const total = exe + rec + maq;
      acerto[m] = { executor: exe, recebidoSol: rec, maquina: maq, total, porGrupo, recebidoPF, jaPago, saldo: total - recebidoPF - jaPago };
    }
    const outrosSolicitantes = L.filter(r => r.repSol && !ehDaCasa(r.sol)).reduce((a, r) => a + r.repSol, 0);
    const semDono = L.filter(r => !ehDaCasa(r.resp));   // executor fora da tabela: tudo fica na clínica

    // Resultado da clínica por área
    const colunas = [...AREAS.map(([a, n]) => [a, n]), ['bloco', 'Bloco']];
    const res = {};
    for (const [a] of colunas) {
      const rs = a === 'bloco' ? [] : L.filter(r => r.area === a);
      const bl = a === 'bloco' ? B : [];
      const o = { caixa: soma(rs, 'caixa') + soma(bl, 'caixa'), conv: soma(rs, 'conv') + soma(bl, 'conv') };
      o.bruto = o.caixa + o.conv; o.imposto = soma(rs, 'imposto'); o.cartao = soma(rs, 'cartao'); o.insumo = soma(rs, 'insumo');
      o.liquido = o.bruto - o.imposto - o.cartao - o.insumo;
      o.executores = soma(rs, 'executor'); o.solicitantes = soma(rs, 'repSol'); o.maquina = soma(rs, 'maquina'); o.comissao = soma(rs, 'comissao');
      o.clinica = o.liquido - o.executores - o.solicitantes - o.maquina - o.comissao;
      res[a] = o;
    }
    const T = k => colunas.reduce((acc, [a]) => acc + res[a][k], 0);
    const porGrupoPago = {}; for (const p of PG) if (p.noPeriodo) porGrupoPago[p.grupo] = (porGrupoPago[p.grupo] || 0) + p.valor;
    const despesas = P.gruposDespesa.reduce((a, g) => a + (porGrupoPago[g] || 0), 0);
    const divida = P.gruposDivida.reduce((a, g) => a + (porGrupoPago[g] || 0), 0);
    const fora = Object.entries(porGrupoPago).filter(([g]) => g.startsWith('FORA:')).reduce((a, [, v]) => a + v, 0);
    const verificar = porGrupoPago['VERIFICAR'] || 0;
    const totalPago = PG.reduce((a, p) => a + p.valor, 0);
    const ficouClinica = T('clinica') - num(retencao);
    const clinica = {
      colunas, res, bruto: T('bruto'), caixa: T('caixa'), conv: T('conv'), imposto: T('imposto'), cartao: T('cartao'), insumo: T('insumo'),
      retencao: num(retencao), liquido: T('liquido') - num(retencao), executores: T('executores'), solicitantes: T('solicitantes'),
      maquina: T('maquina'), comissao: T('comissao'), ficouClinica, porGrupoPago, despesas, divida, fora, verificar, totalPago,
      conferenciaPagos: r2(totalPago - despesas - divida - fora - verificar),
      resultadoOperacional: ficouClinica - despesas, sobrou: ficouClinica - despesas - divida
    };
    return { iv, linhas: L, bloco: B, pagos: PG, medicos, porArea, acerto, outrosSolicitantes, semDono, clinica };
  }
  return { calcular, linha, grupoPago, secaoPago, grupoConvenio };
}

const SEED = /*SEED-START*/{}/*SEED-END*/;

/* =====================================================================
   ARMAZENAMENTO (IndexedDB no navegador; nada sai do computador)
   ===================================================================== */
const DB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((ok, err) => {
    const r = indexedDB.open('bi-gco', 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); };
    r.onsuccess = () => ok(r.result); r.onerror = () => err(r.error);
  }));
  const tx = async (mode, fn) => { const d = await open(); return new Promise((ok, err) => {
    const t = d.transaction('kv', mode); const s = t.objectStore('kv'); const q = fn(s); t.oncomplete = () => ok(q && q.result); t.onerror = () => err(t.error); }); };
  return {
    get: k => tx('readonly', s => s.get(k)).catch(() => null),
    set: (k, v) => tx('readwrite', s => s.put(v, k)).catch(e => alert('Não foi possível salvar: ' + e)),
    del: k => tx('readwrite', s => s.delete(k)),
    keys: () => tx('readonly', s => s.getAllKeys()).catch(() => [])
  };
})();

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const S = { fRel: 'todos', fMed: 'todos', fPapel: 'ambos', fBusca: '', premissas: null, api: { url: '', token: '', auto: false }, per: null, periodo: null, calc: null, area: 'todas', filtroPagos: 'todos' };
const fmt = v => (Math.abs(v) < 0.005 ? '-' : v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const fmtP = v => (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const td = (v, cls = '') => `<td class="n ${v < -0.005 ? 'neg' : ''} ${cls}">${fmt(v)}</td>`;
const chave = per => `periodo:${per.ano}-${String(per.mes).padStart(2, '0')}-${per.parte}`;
const curto = m => m.split(' ').slice(0, 1).join(' ');
const status = t => document.getElementById('status').textContent = t;

async function init() {
  S.premissas = (await DB.get('premissas')) || JSON.parse(JSON.stringify(DEFAULT_PREMISSAS));
  S.api = (await DB.get('api')) || S.api;
  const hoje = new Date(); const sa = document.getElementById('selAno'), sm = document.getElementById('selMes');
  for (let a = hoje.getFullYear() + 1; a >= 2025; a--) sa.add(new Option(a, a));
  MESES.forEach((m, i) => sm.add(new Option(m, i + 1)));
  const ult = (await DB.get('ultimoPeriodo')) || { ano: 2026, mes: 11 };
  sa.value = ult.ano; sm.value = ult.mes;
  [sa, sm].forEach(el => el.onchange = trocarPeriodo);
  document.querySelectorAll('#nav button').forEach(b => b.onclick = () => aba(b.dataset.t));
  await trocarPeriodo();
  retomarColeta();
}
function aba(t) {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('on', s.id === 't-' + t));
}
async function trocarPeriodo() {
  S.per = { ano: +document.getElementById('selAno').value, mes: +document.getElementById('selMes').value, parte: 'M' };
  await DB.set('ultimoPeriodo', S.per);
  S.periodo = (await DB.get(chave(S.per))) || (SEED[chave(S.per)] ? JSON.parse(JSON.stringify(SEED[chave(S.per)])) : null)
    || { dados: {}, totais: {}, origem: {}, lanc: {}, retencao: 0 };
  completarPacientes(S.periodo, SEED[chave(S.per)]);
  recalcular();
}
/* Período salvo no navegador antes de os dados embutidos terem o nome do paciente:
   copia o PACIENTE dos dados embutidos quando as linhas são as mesmas (data e item). */
function completarPacientes(per, seed) {
  if (!per || !per.dados || !seed || !seed.dados) return;
  for (const [k, linhas] of Object.entries(per.dados)) {
    const s = seed.dados[k];
    if (!Array.isArray(linhas) || !Array.isArray(s) || linhas.length !== s.length || !linhas.length) continue;
    if (linhas.some(l => l.PACIENTE)) continue;
    if (!linhas.every((l, i) => l.DATA_ATENDIMENTO === s[i].DATA_ATENDIMENTO && l.ITEM === s[i].ITEM)) continue;
    linhas.forEach((l, i) => { if (s[i].PACIENTE) l.PACIENTE = s[i].PACIENTE; });
  }
}
async function retomarColeta() {
  if (!S.api || !S.api.url || !S.api.token) return;
  try { const j = await apiGet(`/status?ano=${S.per.ano}&mes=${S.per.mes}`); const c = j.coleta || {};
    if (c.rodando && c.periodo === `${S.per.ano}-${String(S.per.mes).padStart(2, '0')}`) atualizarDoTotvs(true); } catch (x) {}
}
async function salvarPeriodo() { await DB.set(chave(S.per), S.periodo); }
function recalcular() {
  S.calc = criarMotor(S.premissas).calcular(S.periodo.dados, S.per, S.periodo.lanc, S.periodo.retencao);
  const n = Object.values(S.periodo.dados).reduce((a, v) => a + (v ? v.length : 0), 0);
  status(n ? `${MESES[S.per.mes - 1]}/${S.per.ano} · ${n} linhas` : 'Sem dados neste mês — importe os relatórios em "Dados e integração"');
  renderTudo();
}
function renderTudo() { renderPainel(); renderMedicos(); renderAcerto(); renderClinica(); renderPagos(); renderPremissas(); renderDados(); }

function renderMedicos() {

  const A = Object.fromEntries(cols.map(m => [m, agg(m)]));
  const linha = (lab, f, cls = '', pctDe = null) => `<tr class="${cls}"><td class="lab">${lab}</td>${cols.map(m => {
    const v = f(A[m], m); const p = pctDe ? pctDe(A[m]) : null;

  const html = `

    <tr class="prod"><td class="lab">(+) Produção bruta — convênio</td>${cols.map(m => `<td></td>${td(A[m].conv)}`).join('')}</tr>
    ${linha('(=) Produção bruta', o => o.bruto, 'prod')}
    ${linha('(−) Imposto', o => -o.imposto)}
    ${linha('(−) Taxa de cartão', o => -o.cartao)}
    ${linha('(−) Custo de insumos', o => -o.insumo)}
    ${linha('(=) LÍQUIDO', o => o.liquido, 'tot')}
    ${linha('(−) Repasse ao médico que solicitou (20%) — % do líquido', o => -o.repSol, '', o => -o.liquido)}
    ${linha('(=) BASE DA DIVISÃO — % do líquido', o => o.base, 'tot', o => o.liquido)}
    ${linha('(=) Repasse médico executor — % da base', o => o.executor, '', o => o.base)}
    ${linha('(−) Comissão comercial (sai da clínica) — % do líquido', o => -o.comissao, '', o => -o.liquido)}
    ${linha('(−) Máquina do Dr. Nilton (sai da clínica) — % do líquido', o => -o.maquinaSai, '', o => -o.liquido)}
    ${linha('(=) Repasse clínica — % do líquido', o => o.clinica, '', o => o.liquido)}
    <tr class="sec"><td colspan="${1 + cols.length * 2}">QUANTO O MÉDICO RECEBE</td></tr>
    ${linha('Parte dele como executor', o => o.executor)}
    ${linha('Recebido como solicitante (pedidos que outro médico executou)', o => o.recebidoSol)}
    ${linha('Repasse da máquina (Dr. Nilton)', o => o.maquinaRecebe)}
    ${linha('TOTAL DO MÉDICO', o => o.executor + o.recebidoSol + o.maquinaRecebe, 'tot')}
    <tr class="sec"><td colspan="${1 + cols.length * 2}">CONFERÊNCIA COM O TOTVS</td></tr>
    ${linha('Repasse do executor calculado pelo Totvs', o => o.executorTotvs, 'memo')}
    ${linha('Diferença (regras da clínica − Totvs)', o => o.executor - o.executorTotvs, 'memo')}
  </table></div>
  <p class="muted">Diferença contra o Totvs = repasse a médico de fora em exames, comissão descontada da base do médico e repasse/comissão calculados também sobre o insumo — pontos a ajustar com o suporte.
  ${c.outrosSolicitantes ? `<br>Repasse pago a médicos solicitantes de fora (fora de exames): <b>R$ ${fmt(c.outrosSolicitantes)}</b>.` : ''}
  ${c.semDono.length ? `<br><span class="tag warn">${c.semDono.length} linha(s) com executor fora da tabela de médicos — 100% clínica.</span>` : ''}</p></div>`;
  const el = document.getElementById('t-medicos'); el.innerHTML = html;
  el.querySelectorAll('#chipsArea button').forEach(b => b.onclick = () => { S.area = b.dataset.a; renderMedicos(); });
}

/* ---------- ACERTO ---------- */
function renderAcerto() {
  const c = S.calc, ms = c.medicos, P = S.premissas, lanc = S.periodo.lanc;
  const inp = (m, campo, sub) => { const v = sub ? (((lanc[m] || {}).pf || {})[sub] || 0) : ((lanc[m] || {})[campo] || 0);
    return `<td class="n"><input class="in" data-m="${esc(m)}" data-c="${campo}" data-s="${sub || ''}" value="${v ? String(v).replace('.', ',') : ''}" placeholder="0,00"></td>`; };
  const sumC = f => ms.reduce((a, m) => a + f(m), 0);
  const kpiMed = (nome, dev, rec, sal) => { const pc = dev > 0 ? Math.max(0, Math.min(1, rec / dev)) : 0;
    return `<div class="kpi acm"><div class="nm">${esc(nome)}</div>
      <div class="lin"><span>Devido no período</span><b>R$ ${fmt(dev)}</b></div>
      <div class="lin"><span>Já recebeu</span><b class="ok">R$ ${fmt(rec)}</b></div>
      <div class="bar"><i style="width:${(pc * 100).toFixed(1)}%"></i></div>
      <div class="lin falta"><span>${sal < -0.005 ? 'Recebeu a mais' : 'Falta receber'}</span><b class="${sal < -0.005 ? 'neg' : ''}">R$ ${fmt(Math.abs(sal))}</b></div>
      <div class="pc">${(pc * 100).toFixed(0)}% recebido</div></div>`; };
  const rec = m => c.acerto[m].recebidoPF + c.acerto[m].jaPago;
  const html = `<div class="kpis acms">${ms.map(m => kpiMed(m, c.acerto[m].total, rec(m), c.acerto[m].saldo)).join('')}
    ${kpiMed('TOTAL DOS MÉDICOS', sumC(m => c.acerto[m].total), sumC(rec), sumC(m => c.acerto[m].saldo))}</div>
  <div class="card"><h2>Acerto com os médicos — ${MESES[S.per.mes - 1]}/${S.per.ano} </h2>
  <div class="tw"><table class="rel">
    <tr><th style="text-align:left"></th>${ms.map(m => `<th>${esc(m)}</th>`).join('')}<th>TOTAL</th></tr>
    <tr class="sec"><td colspan="${ms.length + 2}">1. REPASSE DEVIDO POR CONVÊNIO (executor + solicitante + máquina)</td></tr>
    ${P.gruposOrdem.map(g => `<tr><td class="lab">${g}</td>${ms.map(m => td(c.acerto[m].porGrupo[g])).join('')}${td(sumC(m => c.acerto[m].porGrupo[g]))}</tr>`).join('')}
    <tr class="tot"><td>(=) TOTAL DO REPASSE DEVIDO</td>${ms.map(m => td(c.acerto[m].total)).join('')}${td(sumC(m => c.acerto[m].total))}</tr>
    <tr class="sec"><td colspan="${ms.length + 2}">2. JÁ RECEBIDO NA CONTA PF (convênio pago direto ao médico)</td></tr>
    ${P.gruposOrdem.filter(g => g !== 'Particular').map(g => `<tr><td class="lab">(−) ${g} — líquido recebido na conta</td>${ms.map(m => inp(m, 'pf', g)).join('')}${td(sumC(m => num(((lanc[m] || {}).pf || {})[g])))}</tr>`).join('')}
    <tr class="tot"><td>(=) TOTAL JÁ RECEBIDO NA CONTA PF</td>${ms.map(m => td(c.acerto[m].recebidoPF)).join('')}${td(sumC(m => c.acerto[m].recebidoPF))}</tr>
    <tr class="sec"><td colspan="${ms.length + 2}">3. JÁ PAGO PELA CLÍNICA NO PERÍODO</td></tr>
    <tr><td class="lab">(−) Adiantamentos / Pix / transferências</td>${ms.map(m => inp(m, 'adiantamentos')).join('')}${td(sumC(m => num((lanc[m] || {}).adiantamentos)))}</tr>
    <tr><td class="lab">(−) Outros descontos combinados</td>${ms.map(m => inp(m, 'outros')).join('')}${td(sumC(m => num((lanc[m] || {}).outros)))}</tr>
    <tr class="tot"><td>(=) TOTAL JÁ PAGO</td>${ms.map(m => td(c.acerto[m].jaPago)).join('')}${td(sumC(m => c.acerto[m].jaPago))}</tr>
    <tr class="sec"><td colspan="${ms.length + 2}">4. SALDO</td></tr>
    <tr class="tot"><td>(=) SALDO A PAGAR PELA CLÍNICA (negativo = médico recebeu a mais)</td>${ms.map(m => td(c.acerto[m].saldo)).join('')}${td(sumC(m => c.acerto[m].saldo))}</tr>
  </table></div>
  <p class="muted">Particular: acerto no mês seguinte. Convênio: acerto quando o convênio paga (direto na conta PF do médico). Dra. Luiza: lançar só a parte de Gramado.</p>
  <div class="row"><label class="muted">Observações</label></div>
  <textarea id="obsAcerto" style="width:100%;min-height:70px" class="txt">${esc(S.periodo.obs || '')}</textarea></div>`;
  const el = document.getElementById('t-acerto'); el.innerHTML = html;
  el.querySelectorAll('input.in').forEach(i => i.onchange = async () => {
    const m = i.dataset.m, cpo = i.dataset.c, sub = i.dataset.s, v = num(i.value);
    lanc[m] = lanc[m] || {}; if (sub) { lanc[m].pf = lanc[m].pf || {}; lanc[m].pf[sub] = v; } else lanc[m][cpo] = v;
    await salvarPeriodo(); recalcular(); aba('acerto');
  });
  el.querySelector('#obsAcerto').onchange = async e => { S.periodo.obs = e.target.value; await salvarPeriodo(); };
}

/* ---------- RESULTADO CLÍNICA ---------- */
function renderClinica() {
  const k = S.calc.clinica, P = S.premissas, cols = k.colunas;
  const L = (lab, f, cls = '', total = null) => `<tr class="${cls}"><td class="lab">${lab}</td>${cols.map(([a]) => td(f(k.res[a]))).join('')}${td(total != null ? total : cols.reduce((x, [a]) => x + f(k.res[a]), 0))}<td class="n pct">${k.bruto ? fmtP((total != null ? total : cols.reduce((x, [a]) => x + f(k.res[a]), 0)) / k.bruto) : ''}</td></tr>`;
  const T = (lab, v, cls = '') => `<tr class="${cls}"><td class="lab">${lab}</td>${cols.map(() => '<td></td>').join('')}${td(v)}<td class="n pct">${k.bruto ? fmtP(v / k.bruto) : ''}</td></tr>`;
  const sec = t => `<tr class="sec"><td colspan="${cols.length + 3}">${t}</td></tr>`;
  const g = k.porGrupoPago;
  const html = `<div class="card"><h2>Resultado da clínica — ${MESES[S.per.mes - 1]}/${S.per.ano} </h2><div class="tw"><table class="rel">
    <tr><th style="text-align:left"></th>${cols.map(([, n]) => `<th>${n}</th>`).join('')}<th>TOTAL</th><th>% bruto</th></tr>
    ${sec('1. FATURAMENTO BRUTO')}
    ${L('Caixa (particular e coparticipação)', o => o.caixa)}${L('Convênio', o => o.conv)}${L('(=) BRUTO TOTAL', o => o.bruto, 'tot')}
    ${sec('2. DESCONTOS ANTES DO LÍQUIDO')}
    ${L('(−) Impostos sobre a nota', o => -o.imposto)}${L('(−) Taxa de cartão', o => -o.cartao)}${L('(−) Custo de insumos', o => -o.insumo)}
    <tr><td class="lab">(−) Retenção / glosa de convênio (o Totvs não desconta — digitar)</td>${cols.map(() => '<td></td>').join('')}<td class="n"><input class="in" id="inRet" value="${k.retencao ? String(k.retencao).replace('.', ',') : ''}" placeholder="0,00"></td><td></td></tr>
    ${L('(=) LÍQUIDO', o => o.liquido, 'tot', k.liquido)}
    ${sec('3. PARA ONDE FOI O LÍQUIDO')}
    ${L('(−) Médicos executores', o => -o.executores)}${L('(−) Médicos que solicitaram (20%)', o => -o.solicitantes)}
    ${L('(−) Dr. Nilton — 20% da máquina', o => -o.maquina)}${L('(−) Comissão comercial (sobre a venda)', o => -o.comissao)}
    ${L('(=) FICOU COM A CLÍNICA', o => o.clinica, 'tot', k.ficouClinica)}
    ${sec('4. DESPESAS DA OPERAÇÃO (aba Pagos, baixas no período)')}
    ${P.gruposDespesa.map(x => T('(−) ' + x, g[x] || 0)).join('')}
    ${T('(=) TOTAL DAS DESPESAS', k.despesas, 'tot')}${T('(=) RESULTADO OPERACIONAL (antes da dívida)', k.resultadoOperacional, 'tot')}
    ${sec('5. SERVIÇO DA DÍVIDA E APLICAÇÕES')}
    ${P.gruposDivida.map(x => T('(−) ' + x, g[x] || 0)).join('')}
    ${T('(=) QUANTO SOBROU', k.sobrou, 'tot')}
    ${sec('6. PAGOS QUE NÃO ENTRAM NO RESULTADO (conferência)')}
    ${Object.keys(g).filter(x => x.startsWith('FORA:')).map(x => T(x.replace('FORA: ', ''), g[x], 'memo')).join('')}
    ${T('Pagamentos sem grupo (VERIFICAR)', k.verificar, k.verificar ? '' : 'memo')}
    ${T('(=) Total pago no período', k.totalPago, 'tot')}
    <tr class="memo"><td class="lab">Conferência: total pago − (despesas + dívida + fora + verificar)</td>${cols.map(() => '<td></td>').join('')}<td class="n ${k.conferenciaPagos ? 'neg' : 'ok'}">${k.conferenciaPagos ? fmt(k.conferenciaPagos) : 'OK'}</td><td></td></tr>
  </table></div></div>`;
  const el = document.getElementById('t-clinica'); el.innerHTML = html;
  el.querySelector('#inRet').onchange = async e => { S.periodo.retencao = num(e.target.value); await salvarPeriodo(); recalcular(); aba('clinica'); };
}

/* ---------- PAGOS ---------- */
function renderPagos() {
  const pg = S.calc.pagos.filter(p => p.noPeriodo);
  const f = S.filtroPagos; const lista = pg.filter(p => f === 'todos' || p.secao === f || p.grupo === f);
  const porG = {}; pg.forEach(p => { porG[p.grupo] = (porG[p.grupo] || 0) + p.valor; });
  const dp = S.periodo.dados.pagos || [];
  const html = `<div class="card"><h2>Importar Pagos — ${MESES[S.per.mes - 1]}/${S.per.ano}</h2><div class="row">
      <label class="btn sm">Escolher arquivo<input type="file" id="arqPagos" accept=".xls,.xlsx" hidden></label>
      <span>${dp.length} linhas · ${esc((S.periodo.origem || {}).pagos || '—')}</span> ${confRel('pagos')}
      ${dp.length ? '<button class="btn sm sec" id="limpaPagos">limpar</button>' : ''}</div>
      <p class="muted">Relatório de contas pagas do Totvs. Só entram as baixas feitas dentro do mês selecionado.</p></div>
    <div class="card"><h2>Pagos do período (${pg.length} baixas · R$ ${fmt(pg.reduce((a, p) => a + p.valor, 0))})</h2>
    <div class="chips" id="chipsPg">${['todos', 'Despesa', 'Dívida', 'Fora', 'Verificar'].map(x => `<button data-f="${x}" class="${f === x ? 'on' : ''}">${x === 'todos' ? 'Todos' : x}</button>`).join('')}</div>
    <h3>Por grupo</h3><div class="tw"><table><tr><th style="text-align:left">Grupo</th><th>Seção</th><th>Valor</th></tr>
      ${Object.entries(porG).sort((a, b) => b[1] - a[1]).map(([g, v]) => `<tr><td>${esc(g)}</td><td>${esc(criarMotor(S.premissas).secaoPago(g))}</td>${td(v)}</tr>`).join('')}</table></div>
    <h3>Baixas (${lista.length})</h3><div class="tw"><table>
      <tr><th>Baixa</th><th style="text-align:left">Nome</th><th style="text-align:left">Histórico</th><th>Tipo</th><th>Centro de custo</th><th>Valor</th><th style="text-align:left">Grupo</th></tr>
      ${lista.map(p => `<tr><td>${esc(p['Baixa'].split('-').reverse().join('/'))}</td><td>${esc(p['Nome'])}</td><td style="white-space:normal;max-width:360px">${esc(p['Histórico'])}</td><td>${esc(p['Tipo do Documento'])}</td><td>${esc(p['CENTRO DE CUSTOS'] ?? p['Centro de custos'])}</td>${td(p.valor)}<td>${p.grupo === 'VERIFICAR' ? '<span class="tag bad">VERIFICAR</span>' : esc(p.grupo)}</td></tr>`).join('')}
    </table></div><p class="muted">Para mudar o grupo de um pagamento, inclua uma palavra do Nome/Histórico em Premissas → Regras dos pagos (vale a última regra que servir).</p></div>`;
  const el = document.getElementById('t-pagos'); el.innerHTML = html;
  el.querySelectorAll('#chipsPg button').forEach(b => b.onclick = () => { S.filtroPagos = b.dataset.f; renderPagos(); });
  el.querySelector('#arqPagos').onchange = e => importarArquivos([...e.target.files], 'pagos');
  const lp = el.querySelector('#limpaPagos'); if (lp) lp.onclick = async () => { delete S.periodo.dados.pagos; delete S.periodo.totais.pagos; await salvarPeriodo(); recalcular(); aba('pagos'); };
}

/* ---------- PREMISSAS (editáveis) ---------- */
function renderPremissas() {
  const P = S.premissas;
  const pctIn = (v, attrs) => `<input class="in" style="width:70px" ${attrs} value="${(num(v) * 100).toLocaleString('pt-BR', { maximumFractionDigits: 2 })}">`;
  const html = `
  <div class="card"><h2>1. % do médico executor por área (sobre a base: líquido − repasse ao solicitante)</h2><div class="tw"><table>
    <tr><th style="text-align:left">Médico (nome igual ao do Totvs)</th>${AREAS.map(([, n]) => `<th>${n} %</th>`).join('')}<th></th></tr>
    ${Object.entries(P.medicos).map(([m, t]) => `<tr><td>${esc(m)}</td>${AREAS.map(([a]) => `<td class="n">${pctIn(t[a], `data-pm="${esc(m)}" data-pa="${a}"`)}</td>`).join('')}<td><button class="btn sm sec" data-delmed="${esc(m)}">remover</button></td></tr>`).join('')}
  </table></div><div class="row"><input class="txt" id="novoMed" placeholder="NOME COMPLETO DO MÉDICO" style="width:320px"><button class="btn sm" id="addMed">Adicionar médico</button></div></div>

  <div class="card"><h2>2. Exceções de % em lentes</h2><div class="tw"><table>
    <tr><th>1º nome</th><th>Tipo de lente</th><th>% do médico</th><th></th></tr>
    ${P.excecoesLentes.map((e, i) => `<tr><td><input class="txt" data-ex="${i}" data-k="nomeCurto" value="${esc(e.nomeCurto)}"></td>
      <td><select class="txt" data-ex="${i}" data-k="tipo">${['Lente', 'Escleral', 'Teste de Lente'].map(t => `<option ${t === e.tipo ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
      <td class="n">${pctIn(e.pct, `data-ex="${i}" data-k="pct"`)}</td><td><button class="btn sm sec" data-delex="${i}">remover</button></td></tr>`).join('')}
  </table></div><button class="btn sm" id="addEx">Adicionar exceção</button>
  <p class="muted">Tipo "Lente" = gelatinosa e demais (tudo que não é escleral nem teste).</p></div>

  <div class="card"><h2>3. Palavras e parâmetros</h2>
    <div class="row"><b style="width:280px">Itens que são PROCEDIMENTO (o resto é cirurgia)</b><input class="txt" id="pProc" style="flex:1" value="${esc(P.palavrasProcedimento.join(';'))}"></div>
    <div class="row"><b style="width:280px">Palavra da lente escleral</b><input class="txt" id="pEscl" value="${esc(P.tiposLente[0].palavra)}">
      <b>Palavra do teste de lente</b><input class="txt" id="pTeste" value="${esc(P.tiposLente[1].palavra)}"></div>
    <div class="row"><b style="width:280px">Máquina: dono</b><select class="txt" id="pMaqDono">${Object.keys(P.medicos).map(m => `<option ${m === P.maquina.dono ? 'selected' : ''}>${esc(m)}</option>`).join('')}</select>
      <b>% do líquido</b>${pctIn(P.maquina.pct, 'id="pMaqPct"')}</div>
    <div class="row"><b style="width:280px">Máquina: palavras dos exames</b><input class="txt" id="pMaqPal" style="flex:1" value="${esc(P.maquina.palavras.join(';'))}"></div>
    <div class="row"><b style="width:280px">Comissão comercial (% sobre a venda)</b>${pctIn(P.comissaoPct, 'id="pCom"')}</div>
    <p class="muted">Listas separadas por ponto e vírgula. A busca não diferencia maiúsculas de minúsculas.</p></div>

  <div class="card"><h2>4. Grupo de convênio</h2><div class="tw"><table><tr><th>Convênio no Totvs</th><th>Grupo</th><th></th></tr>
    ${Object.entries(P.convenios).map(([cv, g]) => `<tr><td>${esc(cv)}</td><td><select class="txt" data-cv="${esc(cv)}">${P.gruposOrdem.map(x => `<option ${x === g ? 'selected' : ''}>${x}</option>`).join('')}</select></td><td><button class="btn sm sec" data-delcv="${esc(cv)}">remover</button></td></tr>`).join('')}
  </table></div><div class="row"><input class="txt" id="novoCv" placeholder="NOME DO CONVÊNIO NO TOTVS"><select class="txt" id="novoCvG">${P.gruposOrdem.map(x => `<option>${x}</option>`).join('')}</select><button class="btn sm" id="addCv">Adicionar</button></div>
  <p class="muted">O que não estiver na lista vira "${esc(P.grupoPadrao)}".</p></div>

  <div class="card"><h2>5. Regras dos pagos (vale a ÚLTIMA que servir)</h2>
    <p class="muted">Procura a palavra em Tipo | Nome | Histórico | Centro de custo. Regras gerais em cima, específicas embaixo.</p><div class="tw"><table>
    <tr><th>#</th><th style="text-align:left">Palavra</th><th style="text-align:left">Grupo</th><th></th></tr>
    ${P.pagosRegras.map(([w, g], i) => `<tr><td>${i + 1}</td><td><input class="txt" data-rg="${i}" data-k="0" value="${esc(w)}"></td>
      <td><select class="txt" data-rg="${i}" data-k="1">${gruposPagosTodos().map(x => `<option ${x === g ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select></td>
      <td><button class="btn sm sec" data-up="${i}">↑</button> <button class="btn sm sec" data-dn="${i}">↓</button> <button class="btn sm sec" data-delrg="${i}">×</button></td></tr>`).join('')}
  </table></div><button class="btn sm" id="addRg">Adicionar regra no fim</button></div>

  <div class="card"><h2>Backup das premissas</h2><div class="row">
    <button class="btn" id="expP">Exportar premissas (JSON)</button>

    <button class="btn sec" id="resetP">Voltar ao padrão</button></div></div>`;
  const el = document.getElementById('t-premissas'); el.innerHTML = html;

  el.querySelector('#addMed').onclick = () => { const m = UP(el.querySelector('#novoMed').value).trim(); if (m && !P.medicos[m]) { P.medicos[m] = { consultas: 0.6, exames: 0.3, cirurgias: 0.7, procedimentos: 0.7, lentes: 0.3 }; salvar(); } };
  el.querySelectorAll('[data-ex]').forEach(i => i.onchange = () => { const e = P.excecoesLentes[+i.dataset.ex], k = i.dataset.k;
    e[k] = k === 'pct' ? pv(i) : k === 'nomeCurto' ? UP(i.value).trim() : i.value; salvar(); });
  el.querySelectorAll('[data-delex]').forEach(b => b.onclick = () => { P.excecoesLentes.splice(+b.dataset.delex, 1); salvar(); });
  el.querySelector('#addEx').onclick = () => { P.excecoesLentes.push({ nomeCurto: '', tipo: 'Lente', pct: 0.3 }); salvar(); };
  const lista = id => el.querySelector(id).value.split(';').map(s => s).filter(s => s.trim() !== '');
  el.querySelector('#pProc').onchange = () => { P.palavrasProcedimento = lista('#pProc'); salvar(); };
  el.querySelector('#pEscl').onchange = e => { P.tiposLente[0].palavra = e.target.value; salvar(); };
  el.querySelector('#pTeste').onchange = e => { P.tiposLente[1].palavra = e.target.value; salvar(); };
  el.querySelector('#pMaqDono').onchange = e => { P.maquina.dono = e.target.value; salvar(); };
  el.querySelector('#pMaqPct').onchange = e => { P.maquina.pct = pv(e.target); salvar(); };
  el.querySelector('#pMaqPal').onchange = () => { P.maquina.palavras = lista('#pMaqPal'); salvar(); };
  el.querySelector('#pCom').onchange = e => { P.comissaoPct = pv(e.target); salvar(); };
  el.querySelectorAll('[data-cv]').forEach(s => s.onchange = () => { P.convenios[s.dataset.cv] = s.value; salvar(); });
  el.querySelectorAll('[data-delcv]').forEach(b => b.onclick = () => { delete P.convenios[b.dataset.delcv]; salvar(); });
  el.querySelector('#addCv').onclick = () => { const c = UP(el.querySelector('#novoCv').value).trim(); if (c) { P.convenios[c] = el.querySelector('#novoCvG').value; salvar(); } };
  el.querySelectorAll('[data-rg]').forEach(i => i.onchange = () => { P.pagosRegras[+i.dataset.rg][+i.dataset.k] = i.value; salvar(); });

function relatorioMedico(m) {
  const c = S.calc, a = c.acerto[m]; if (!a) return;

  const h1 = ['Data', 'Área', 'Tipo', 'Paciente', 'Convênio', 'Item', 'Solicitante', 'Caixa', 'Convênio (valor)', 'Imposto', 'Cartão', 'Insumo', 'Líquido', 'Repasse ao solicitante', 'Base', '% do médico', 'Repasse do médico', 'Comissão comercial', 'Máquina', 'Clínica'];
  const s1 = [h1, ...resp.map(r => [dt(r.data), AREA_NOME[r.area], r.tipo || '', r.paciente, r.convenio, r.item, r.sol, R(r.caixa), R(r.conv), R(r.imposto), R(r.cartao), R(r.insumo), R(r.liquido), R(r.repSol), R(r.base), r.pct, R(r.executor), R(r.comissao), R(r.maquina), R(r.clinica)])];
  const h2 = ['Data', 'Área', 'Paciente', 'Convênio', 'Item', 'Executor', 'Caixa', 'Convênio (valor)', 'Bruto', 'Imposto', 'Cartão', 'Insumo', 'Líquido', 'Repasse recebido (20%)'];
  const s2 = [h2, ...sol.map(r => [dt(r.data), AREA_NOME[r.area], r.paciente, r.convenio, r.item, r.resp, R(r.caixa), R(r.conv), R(r.bruto), R(r.imposto), R(r.cartao), R(r.insumo), R(r.liquido), R(r.repSol)])];

  }

function tipoPeloNome(nome) {
  const n = UP(nome).normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (n.includes('PAGO')) return 'pagos'; if (n.includes('BLOCO')) return 'bloco';
  if (n.includes('CIRURG') || n.includes('PROCED')) return 'cirurgias_procedimentos';
  if (n.includes('EXAME')) return 'exames'; if (n.includes('LENTE')) return 'lentes'; if (n.includes('CONSULT')) return 'consultas';
  return null;
}
async function importarArquivos(files, forcado) {
  const msgs = [];
  for (const f of files) {
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true });
      const nomeAba = r => (r.abas || [r.aba]).find(a => wb.SheetNames.includes(a));
      const abas = Object.entries(RELATORIOS).filter(([, r]) => nomeAba(r));
      if (!forcado && abas.length >= 3) {          // planilha do fechamento inteira
        for (const [k, r] of abas) {
          const aoa = XLSX.utils.sheet_to_json(wb.Sheets[nomeAba(r)], { header: 1, raw: true, defval: '' });
          try { const res = lerRelatorio(aoa, k); S.periodo.dados[k] = res.linhas; S.periodo.totais[k] = res.totalGeral; S.periodo.origem[k] = f.name + ' › ' + r.aba; msgs.push(`${r.nome}: ${res.linhas.length}`); }
          catch (x) { msgs.push(`${r.nome}: ${x.message}`); }
        }
        continue;
      }
      const k = forcado || tipoPeloNome(f.name) || tipoPeloNome(wb.SheetNames[0]);
      if (!k) { msgs.push(`${f.name}: não reconheci o relatório pelo nome`); continue; }
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' });
      const res = lerRelatorio(aoa, k);
      S.periodo.dados[k] = res.linhas; S.periodo.totais[k] = res.totalGeral; S.periodo.origem[k] = f.name;
      msgs.push(`${RELATORIOS[k].nome}: ${res.linhas.length} linhas`);
    } catch (x) { msgs.push(`${f.name}: ${x.message}`); }
  }
  await salvarPeriodo(); recalcular(); aba(forcado === 'pagos' ? 'pagos' : 'dados'); status(msgs.join(' · '));
}

async function apiGet(caminho, metodo) {
  if (!S.api.url) throw new Error('Endereço do robô não configurado');
  let r;
  try { r = await fetch(S.api.url + caminho, { method: metodo || 'GET', cache: 'no-store', headers: { Authorization: 'Bearer ' + (S.api.token || '') } }); }
  catch (x) { throw new Error('sem resposta do robô (endereço errado ou robô desligado)'); }
  let j = null; try { j = await r.json(); } catch (x) {}
  if (r.status === 401) throw new Error('senha de acesso incorreta');
  if (!r.ok && r.status !== 202) { const e = new Error((j && j.erro) || 'HTTP ' + r.status); e.status = r.status; e.falta = j && j.falta; throw e; }
  return j;
}
async function buscarApi(silencioso) {

  const iv = intervalo(S.per); status('Carregando do Totvs…');

      catch (x) { if (x.status === 409) { falta.push(RELATORIOS[k].nome); continue; } throw new Error(`${RELATORIOS[k].nome}: ${x.message}`); }
      if (!Array.isArray(arr) || !arr.length) { novos[k] = []; continue; }
      const head = Object.keys(arr[0]); const aoa = [head, ...arr.map(o => head.map(h => o[h]))];
      novos[k] = lerRelatorio(aoa, k).linhas;
    }
    const quando = new Date().toLocaleString('pt-BR');
    for (const [k, linhas] of Object.entries(novos)) { S.periodo.dados[k] = linhas; if (S.periodo.totais) delete S.periodo.totais[k]; S.periodo.origem[k] = 'API ' + quando; }
    await salvarPeriodo(); recalcular();
    if (document.getElementById('t-dados').classList.contains('on')) renderDados();
    const t = Object.keys(novos).length ? `Carregado do Totvs em ${quando}` : 'Nada carregado';
    status(falta.length ? `${t}. Ainda não coletado no robô: ${falta.join(', ')} — use "Atualizar do Totvs agora".` : t);
    if (falta.length && !silencioso && confirm(`O robô ainda não coletou ${falta.join(', ')} de ${MESES[S.per.mes - 1]}/${S.per.ano}. Buscar no Totvs agora? (leva alguns minutos)`)) return atualizarDoTotvs(false);
    return true;
  } catch (x) { status('Erro na integração: ' + x.message); if (!silencioso) alert('Erro na integração: ' + x.message); return false; }
}
const NOME_REL = { consultas: 'Consultas', exames: 'Exames', bloco: 'Bloco', pagos: 'Pagos', cirurgias_procedimentos: 'Cirurgias e Procedimentos', lentes: 'Lentes' };
function progresso(pct, txt, erro) {
  const p = document.getElementById('prog'); p.hidden = false; p.classList.toggle('erro', !!erro);
  document.getElementById('progBar').style.width = Math.max(0, Math.min(100, pct)) + '%';
  document.getElementById('progPct').textContent = Math.round(pct) + '%';
  document.getElementById('progTxt').textContent = txt;
}
function progressoFim(depoisMs) { setTimeout(() => { document.getElementById('prog').hidden = true; }, depoisMs || 6000); }
const mmss = ms => { const s = Math.round(ms / 1000); return s < 60 ? s + 's' : Math.floor(s / 60) + 'min ' + String(s % 60).padStart(2, '0') + 's'; };
let ACOMPANHANDO = false;
async function atualizarDoTotvs(soAcompanhar) {
  if (ACOMPANHANDO) return; ACOMPANHANDO = true;
  const ano = S.per.ano, mes = S.per.mes, chaveMes = `${ano}-${String(mes).padStart(2, '0')}`;
  // peso de cada relatório na barra (Lentes e Cirurgias são as lentas)
  const PESO = { consultas: 5, exames: 8, bloco: 5, pagos: 3, cirurgias_procedimentos: 40, lentes: 39 };
  const ESPERA = { cirurgias_procedimentos: 240000, lentes: 240000 };   // tempo típico esperado (ms)
  try {
    if (!soAcompanhar) await apiGet(`/coletar?ano=${ano}&mes=${mes}`, 'POST');
    progresso(1, `Buscando ${MESES[mes - 1]}/${ano} no Totvs…`);
    const t0 = Date.now(); let atualAnt = null, tAtual = Date.now(), vistoRodando = false;
    while (Date.now() - t0 < 25 * 60 * 1000) {
      await new Promise(r => setTimeout(r, 3000));
      const j = await apiGet(`/status?ano=${ano}&mes=${mes}`); const c = j.coleta || {};
      if (c.periodo === chaveMes && c.rodando) vistoRodando = true;
      if (c.periodo !== chaveMes && !vistoRodando) { progresso(1, 'Aguardando a vez na fila do robô…'); continue; }
      const prontos = [...(c.feitos || []).map(f => f.rel), ...(c.erros || []).map(e => e.rel)];
      if (c.atual !== atualAnt) { atualAnt = c.atual; tAtual = Date.now(); }
      let pct = prontos.reduce((t, r) => t + (PESO[r] || 0), 0);
      if (c.rodando && c.atual) {   // avanço estimado dentro do relatório atual (no máximo 90% dele)
        const dec = Date.now() - tAtual, esp = ESPERA[c.atual] || 15000;
        pct += (PESO[c.atual] || 0) * Math.min(0.9, dec / esp);
      }
      const feitosTxt = (c.feitos || []).map(f => `${NOME_REL[f.rel] || f.rel} ✓`).join(' · ');
      const agora = c.rodando && c.atual ? `Buscando ${NOME_REL[c.atual] || c.atual}${c.detalhe ? ' · ' + c.detalhe : ''} (${mmss(Date.now() - tAtual)})` : '';
      progresso(c.rodando ? Math.min(pct, 99) : 100, [agora, feitosTxt].filter(Boolean).join('  —  ') + `  · total ${mmss(Date.now() - t0)}`);
      status(`Buscando no Totvs ${String(mes).padStart(2, '0')}/${ano}… ${agora}`);
      if (!c.rodando && c.periodo === chaveMes) {
        const erros = c.erros || [];
        if (S.per.ano === ano && S.per.mes === mes) await buscarApi(true);
        progresso(100, erros.length ? `Concluído com ${erros.length} erro(s): ${erros.map(e => NOME_REL[e.rel] || e.rel).join(', ')}` : `Concluído em ${mmss(Date.now() - t0)} — dados carregados`, erros.length > 0);
        if (erros.length) alert('Alguns relatórios falharam no Totvs:\n' + erros.map(e => `${NOME_REL[e.rel] || e.rel}: ${e.erro}`).join('\n') + '\n\nO resto foi atualizado.');
        progressoFim(erros.length ? 20000 : 8000);
        return;
      }
    }
    progresso(99, 'A busca está demorando mais que o normal. O robô continua trabalhando: clique em "Carregar dados do mês" daqui a alguns minutos.', true);
  } catch (x) { progresso(100, 'Erro: ' + x.message, true); progressoFim(20000); status('Erro na integração: ' + x.message); alert('Erro na integração: ' + x.message); }
  finally { ACOMPANHANDO = false; }
}
/* ---------- backup e restauração (tudo que está guardado neste navegador) ---------- */
async function fazerBackup() {
  const ks = await DB.keys(); const o = {};
  for (const k of ks) if (k !== 'api') o[k] = await DB.get(k);
  const meses = ks.filter(k => String(k).startsWith('periodo:')).length;
  const d = new Date(), dt = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  baixar(`backup-bi-gco-${dt}.json`, JSON.stringify(o));
  if (!meses) alert('Backup gerado. Atenção: ainda não há meses salvos neste navegador (os dados de novembro embutidos no arquivo não precisam de backup).');
}
async function restaurarBackup(input) {
  const f = input.files && input.files[0]; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('formato');
    const ks = Object.keys(o), meses = ks.filter(k => k.startsWith('periodo:')).map(k => { const [a, m] = k.slice(8).split('-'); return `${m}/${a}`; });
    if (!ks.length) throw new Error('vazio');
    if (!confirm(`Restaurar o backup "${f.name}"?\n\n${meses.length ? 'Meses: ' + meses.join(', ') : 'Sem meses'}${ks.includes('premissas') ? '\nInclui as premissas' : ''}\n\nOs meses com o mesmo nome neste navegador serão substituídos pelos do backup.`)) return;
    for (const [k, v] of Object.entries(o)) await DB.set(k, v);
    S.premissas = (await DB.get('premissas')) || S.premissas;
    await trocarPeriodo();
    alert('Backup restaurado.');
  } catch (x) { alert('Arquivo de backup inválido.'); }
  finally { input.value = ''; }
}
document.getElementById('hBackup').onclick = fazerBackup;
document.getElementById('hRestore').onchange = e => restaurarBackup(e.target);
function baixar(nome, txt) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

init();
</script>
